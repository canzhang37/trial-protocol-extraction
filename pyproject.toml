[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protex"
version = "0.1.0"
description = "LLM extraction of trial design fields from ClinicalTrials.gov protocol PDFs, full text vs retrieval"
requires-python = ">=3.10"
authors = [{name = "Can Zhang"}]
dependencies = [
    "anthropic>=2.0",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "pydantic>=2.6",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
protex = "protex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
